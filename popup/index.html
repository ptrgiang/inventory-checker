<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inventory Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="3" width="20" height="14" rx="2" fill="#FF9900"/>
      <path d="M6 10h12M6 13h8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M5 20.5c3.5-1 10.5-1 14 0" stroke="#FF9900" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="header-title">Inventory Checker</div>
      <div class="header-sub">Amazon AOD · v1.0</div>
    </div>
  </div>

  <div class="card">
    <label class="label" style="margin-bottom:6px">Marketplace</label>
    <div class="market-selector">
      <button class="market-btn selected" data-domain="www.amazon.com">United States</button>
      <button class="market-btn" data-domain="www.amazon.ca">Canada</button>
    </div>

    <label class="label">
      ASINs
      <span class="hint">one per line or comma-separated</span>
      <span id="asin-count" class="asin-count"></span>
    </label>
    <textarea id="asin-input" placeholder="B07YBP7HZJ&#10;B0B844TXNX&#10;B08N5WRWNW" rows="5" spellcheck="false" autofocus></textarea>
    <div class="actions">
      <button id="check-btn" title="Check Inventory (Ctrl+Enter)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Check Inventory
      </button>
      <button id="clear-btn" class="ghost">Clear</button>
      <span id="progress"></span>
    </div>
    <div class="progress-bar-wrap" id="progress-bar-wrap">
      <div id="progress-bar"></div>
    </div>
  </div>

  <div id="results-wrap" hidden>
    <div class="results-header">
      <span id="summary"></span>
      <div class="export-btns">
        <button id="copy-btn" class="ghost small">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="8" y="8" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg>
          CSV
        </button>
        <button id="excel-btn" class="excel small">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="8" y1="13" x2="16" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="8" y1="17" x2="16" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Excel
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <table id="results-table">
        <thead>
          <tr>
            <th class="sortable" data-col="0">ASIN</th>
            <th class="sortable num" data-col="1">Inventory</th>
            <th class="sortable center" data-col="2">Status</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
